[env:radio-s3]
extends = env:esp32s3
platform = platformio/espressif32 @ 6.12.0
board_build.flash_mode = dio
board_build.partitions = components/boards/partitions-radio.csv
board_build.embed_files =
    tests/fixtures/screen/mono-blink.rle
    tests/fixtures/screen/frequency.rle
board_build.cmake_extra_args =
    "-DSDKCONFIG_DEFAULTS=config/sdkconfig.defaults;config/sdkconfig.defaults.esp32s3;config/sdkconfig.defaults.radio"
upload_speed = 115200
monitor_dtr = 0
monitor_rts = 0

[env:audio-link-s3]
extends = env:radio-s3
board_build.embed_files =
board_build.cmake_extra_args =
    "-DSDKCONFIG_DEFAULTS=config/sdkconfig.defaults;config/sdkconfig.defaults.esp32s3;config/sdkconfig.defaults.audio-link"

[env:audio-radio-s3]
extends = env:radio-s3
board_build.embed_files =
board_build.cmake_extra_args =
    "-DSDKCONFIG_DEFAULTS=config/sdkconfig.defaults;config/sdkconfig.defaults.esp32s3;config/sdkconfig.defaults.radio;config/sdkconfig.defaults.audio-radio"

[env:audio-optical-bench-s3]
extends = env:audio-radio-s3
board_build.cmake_extra_args =
    "-DSDKCONFIG_DEFAULTS=config/sdkconfig.defaults;config/sdkconfig.defaults.esp32s3;config/sdkconfig.defaults.radio;config/sdkconfig.defaults.audio-radio;config/sdkconfig.defaults.audio-optical-bench"

[env:audio-optical-playback-s3]
extends = env:audio-radio-s3
board_build.cmake_extra_args =
    "-DSDKCONFIG_DEFAULTS=config/sdkconfig.defaults;config/sdkconfig.defaults.esp32s3;config/sdkconfig.defaults.radio;config/sdkconfig.defaults.audio-radio;config/sdkconfig.defaults.audio-optical-playback"

[env:audio-pcm-bench-s3]
extends = env:audio-optical-playback-s3
board_build.cmake_extra_args =
    "-DSDKCONFIG_DEFAULTS=config/sdkconfig.defaults;config/sdkconfig.defaults.esp32s3;config/sdkconfig.defaults.radio;config/sdkconfig.defaults.audio-radio;config/sdkconfig.defaults.audio-optical-playback;config/sdkconfig.defaults.audio-pcm-bench"

[env:controller-s3]
extends = env:radio-s3
; IDF 5.5.5 includes Espressif's I80 DMA startup-stall fix (d3bdd18ddc).
platform = platformio/espressif32 @ 8.0.0
platform_packages =
    platformio/framework-espidf @ 4.50505.0
    platformio/toolchain-xtensa-esp-elf @ 14.2.0+20260121
board_build.cmake_extra_args =
    "-DSDKCONFIG_DEFAULTS=config/sdkconfig.defaults;config/sdkconfig.defaults.esp32s3;config/sdkconfig.defaults.controller"

[env:controller-startup-bench-s3]
extends = env:controller-s3
board_build.cmake_extra_args =
    "-DSDKCONFIG_DEFAULTS=config/sdkconfig.defaults;config/sdkconfig.defaults.esp32s3;config/sdkconfig.defaults.controller;config/sdkconfig.defaults.controller-startup"
